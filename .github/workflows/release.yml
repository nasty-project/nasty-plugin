name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout nasty-go
        uses: actions/checkout@v6
        with:
          repository: nasty-project/nasty-go
          path: ../nasty-go
          token: ${{ secrets.NASTY_PAT }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Run tests
        run: go test ./...

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --config .golangci.yml

      - name: Build binaries for all platforms
        run: |
          VERSION=${{ steps.version.outputs.version }}
          COMMIT=${{ steps.version.outputs.commit }}
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}"

          mkdir -p dist
          cp LICENSE dist/

          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )

          for platform in "${platforms[@]}"; do
            GOOS=${platform%/*}
            GOARCH=${platform#*/}
            output="kubectl-nasty-csi"
            if [ "$GOOS" = "windows" ]; then
              output="${output}.exe"
            fi

            echo "Building for ${GOOS}/${GOARCH}..."
            GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "${LDFLAGS}" \
              -o "dist/${output}" \
              ./cmd/kubectl-nasty-csi

            cd dist
            if [ "$GOOS" = "windows" ]; then
              zip "kubectl-nasty-csi-${GOOS}-${GOARCH}.zip" "${output}" LICENSE
            else
              tar -czvf "kubectl-nasty-csi-${GOOS}-${GOARCH}.tar.gz" "${output}" LICENSE
            fi
            rm "${output}"
            cd ..
          done

          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt
          cd ..

      - name: Generate krew manifest
        run: |
          VERSION=${{ steps.version.outputs.version }}
          TAG=${{ steps.version.outputs.tag }}

          LINUX_AMD64_SHA=$(sha256sum dist/kubectl-nasty-csi-linux-amd64.tar.gz | cut -d' ' -f1)
          LINUX_ARM64_SHA=$(sha256sum dist/kubectl-nasty-csi-linux-arm64.tar.gz | cut -d' ' -f1)
          DARWIN_AMD64_SHA=$(sha256sum dist/kubectl-nasty-csi-darwin-amd64.tar.gz | cut -d' ' -f1)
          DARWIN_ARM64_SHA=$(sha256sum dist/kubectl-nasty-csi-darwin-arm64.tar.gz | cut -d' ' -f1)
          WINDOWS_AMD64_SHA=$(sha256sum dist/kubectl-nasty-csi-windows-amd64.zip | cut -d' ' -f1)

          cat > dist/nasty-csi.yaml << EOF
          apiVersion: krew.googlecontainertools.github.com/v1alpha2
          kind: Plugin
          metadata:
            name: nasty-csi
          spec:
            version: v${VERSION}
            homepage: https://github.com/${{ github.repository }}
            shortDescription: Manage NASty CSI volumes
            description: |
              kubectl plugin for managing NASty CSI driver volumes.

              Commands:
              - list: List all managed volumes with clone relationships
              - list-snapshots: List snapshots with source volumes
              - list-orphaned: Find volumes without matching PVCs
              - describe: Show detailed volume information
              - health: Check health of all volumes
              - troubleshoot: Diagnose PVC issues
              - summary: Dashboard overview of all resources
              - cleanup: Delete orphaned volumes safely
              - mark-adoptable: Mark volumes for DR/adoption
              - adopt: Generate PV manifest for adoption
              - status: Show volume status from NASty
              - connectivity: Test NASty connection
            platforms:
            - selector:
                matchLabels:
                  os: linux
                  arch: amd64
              uri: https://github.com/${{ github.repository }}/releases/download/${TAG}/kubectl-nasty-csi-linux-amd64.tar.gz
              sha256: ${LINUX_AMD64_SHA}
              bin: kubectl-nasty-csi
            - selector:
                matchLabels:
                  os: linux
                  arch: arm64
              uri: https://github.com/${{ github.repository }}/releases/download/${TAG}/kubectl-nasty-csi-linux-arm64.tar.gz
              sha256: ${LINUX_ARM64_SHA}
              bin: kubectl-nasty-csi
            - selector:
                matchLabels:
                  os: darwin
                  arch: amd64
              uri: https://github.com/${{ github.repository }}/releases/download/${TAG}/kubectl-nasty-csi-darwin-amd64.tar.gz
              sha256: ${DARWIN_AMD64_SHA}
              bin: kubectl-nasty-csi
            - selector:
                matchLabels:
                  os: darwin
                  arch: arm64
              uri: https://github.com/${{ github.repository }}/releases/download/${TAG}/kubectl-nasty-csi-darwin-arm64.tar.gz
              sha256: ${DARWIN_ARM64_SHA}
              bin: kubectl-nasty-csi
            - selector:
                matchLabels:
                  os: windows
                  arch: amd64
              uri: https://github.com/${{ github.repository }}/releases/download/${TAG}/kubectl-nasty-csi-windows-amd64.zip
              sha256: ${WINDOWS_AMD64_SHA}
              bin: kubectl-nasty-csi.exe
          EOF

      - name: Generate changelog
        run: |
          VERSION=${{ steps.version.outputs.version }}
          TAG=${{ steps.version.outputs.tag }}

          PREV_TAG=$(git tag -l 'v*' | grep -v "^${TAG}$" | sort -V | tail -1 || echo "")

          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log ${PREV_TAG}..${TAG} --pretty=format:"- %s (%h)" --no-merges)
          fi

          cat > CHANGELOG.md << EOF
          ## kubectl-nasty-csi v${VERSION}

          ### What's Changed

          ${CHANGELOG}

          ### Installation

          #### Using Krew (recommended)
          \`\`\`bash
          kubectl krew install nasty-csi
          \`\`\`

          #### Manual Installation
          Download the appropriate binary for your platform from the assets below and place it in your PATH.

          \`\`\`bash
          # Example for Linux amd64
          tar -xzf kubectl-nasty-csi-linux-amd64.tar.gz
          mv kubectl-nasty-csi /usr/local/bin/
          \`\`\`

          ### Usage
          \`\`\`bash
          kubectl nasty-csi summary              # Dashboard overview
          kubectl nasty-csi list                 # List all managed volumes
          kubectl nasty-csi list-snapshots       # List snapshots
          kubectl nasty-csi list-orphaned        # Find orphaned volumes
          kubectl nasty-csi describe <volume>    # Detailed volume info
          kubectl nasty-csi health               # Check all volumes health
          kubectl nasty-csi troubleshoot <pvc>   # Diagnose PVC issues
          kubectl nasty-csi cleanup --execute    # Delete orphaned volumes
          kubectl nasty-csi connectivity         # Test NASty connection
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: kubectl-nasty-csi ${{ steps.version.outputs.tag }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/nasty-csi.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update krew-index
        uses: rajatjindal/krew-release-bot@v0.0.50
        with:
          krew_template_file: dist/nasty-csi.yaml
